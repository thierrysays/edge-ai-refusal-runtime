name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  evidence:
    # The demonstration is part of the build: if the scenario stops refusing
    # what it is supposed to refuse, that is a failed build, not a changed demo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m governed_edge_ai.cli demo --out ./run --parts 16
      - run: python -m governed_edge_ai.cli verify --journal ./run/journal.jsonl --trust-store ./run/trust-store.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: run/
