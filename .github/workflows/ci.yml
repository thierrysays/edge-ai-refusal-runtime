name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: smoke
        run: python -m pytest tests/test_smoke.py -q
      - name: unit
        run: python -m pytest tests/test_journal.py tests/test_policy.py tests/test_registry_admission.py tests/test_oversight_and_marking.py -q
      - name: functional
        run: python -m pytest tests/test_runtime_e2e.py tests/test_cli.py -q
      - name: documentation
        run: python -m pytest tests/test_repository.py -q

  security:
    # Its own job so a security regression is legible in the checks list rather
    # than buried in a test count.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: adversarial suite
        run: python -m pytest tests/test_adversarial.py -q
      - name: evidence fuzz
        run: |
          python tools/fuzz_evidence.py --iterations 4000 --seed 12
          python tools/fuzz_evidence.py --iterations 4000 --seed 2026

  evidence:
    # The demonstration is part of the build: if the scenario stops refusing
    # what it is supposed to refuse, that is a failed build, not a changed demo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m governed_edge_ai.cli demo --out ./run --parts 16
      - run: python -m governed_edge_ai.cli verify --journal ./run/journal.jsonl --trust-store ./run/trust-store.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: run/

  qa:
    # Lint, types and SAST are a gate, not advice. They run on one interpreter:
    # a style or typing finding does not vary by Python version, and running
    # them three times only makes the log longer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Upgrade the build toolchain before auditing: pip and setuptools carry
      # their own advisories, and a gate that fails on the runner image rather
      # than on this repository trains people to ignore it.
      - run: python -m pip install -U pip setuptools
      - run: pip install -e ".[dev]"
      - name: lint
        run: python -m ruff check src tests tools
      - name: types
        run: python -m mypy
      - name: SAST
        run: python -m bandit -q -r src tools
      - name: dependency advisories
        run: python -m pip_audit --progress-spinner off
      - name: coverage gate
        run: python -m pytest --cov --cov-report=term-missing
